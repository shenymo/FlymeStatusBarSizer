plugins {
    id "com.android.application"
}

android {
    namespace "com.example.flymestatusbarsizer"
    compileSdk 36

    // 构建时间固定使用北京时间，避免 Gradle Daemon 缓存旧的系统时区。
    def buildTime = java.time.ZonedDateTime.now(java.time.ZoneId.of("Asia/Shanghai"))
    def buildVersion = buildTime.format(java.time.format.DateTimeFormatter.ofPattern("yyyyMMddHHmm", Locale.ROOT))
    def buildCode = Integer.parseInt(buildTime.format(java.time.format.DateTimeFormatter.ofPattern("yyyyMMddHH", Locale.ROOT)))
    def buildDate = buildTime.format(java.time.format.DateTimeFormatter.ofPattern("yyyy-MM-dd HH:mm:ss", Locale.ROOT))

    buildFeatures {
        buildConfig true
    }

    // 1. 定义签名配置（从 Linux 环境变量中读取）
signingConfigs {
        release {
            def mKeystorePath = System.getenv("ANDROID_KEYSTORE_PATH")
            def mKeystorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
            def mKeyAlias = System.getenv("ANDROID_KEY_ALIAS")
            def mKeyPassword = System.getenv("ANDROID_KEY_PASSWORD")

            if (mKeystorePath && mKeystorePassword && mKeyAlias && mKeyPassword) {
                // 使用等号明确赋值，消除 Groovy 的语法歧义
                storeFile = file(mKeystorePath)
                storePassword = mKeystorePassword
                keyAlias = mKeyAlias
                keyPassword = mKeyPassword
            }
        }
    }

    defaultConfig {
        applicationId "com.fiyme.statusbarsizer"
        minSdk 26
        targetSdk 36
        versionCode buildCode
        versionName buildVersion
        buildConfigField "String", "BUILD_DATE", "\"${buildDate}\""
    }

    // 2. 配置构建类型，将签名应用到 release
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            
            // 引用上方定义的 signingConfigs.release
            signingConfig signingConfigs.release
        }
        
        debug {
            // debug 默认使用 Android 自动生成的 debug.keystore 签名，无需额外配置
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.forEach { output ->
            output.outputFileName.set(output.versionName.map { "${it}.apk" })
        }
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.16.1"
    implementation "io.github.libxposed:service:101.0.0"
    implementation "org.lsposed.hiddenapibypass:hiddenapibypass:6.1"
    compileOnly "io.github.libxposed:api:101.0.1"
    testRuntimeOnly "io.github.libxposed:api:101.0.1"
}
